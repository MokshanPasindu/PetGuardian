# Application Name
spring.application.name=PetGuardian Backend

# Active Profile
spring.profiles.active=dev

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=cGV0Z3VhcmRpYW4tc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#app.upload.dir=./uploads

# ?? AI Service URLs ???????????????????????????????????????????????????????????
# Used by AIService (existing skin disease)
app.ai.service.url=http://localhost:5000
ai.flask.url=http://localhost:5000
ai.flask.timeout=30000
ai.flask.connect-timeout=5000

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# JPA
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/petguardian-dev;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1234

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.backend.auth.security=DEBUG
logging.level.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Path (dev)
app.upload.dir=./uploads-dev

# CORS
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Error details
server.error.include-stacktrace=always
server.error.include-message=always

# SQL init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
# Scheduling
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

